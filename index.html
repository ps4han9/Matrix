<!DOCTYPE html>
<html lang="ar" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MATRIX STORE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root { --matrix-green: #00ff41; --matrix-dark: rgba(0, 15, 0, 0.9); --matrix-glow: rgba(0, 255, 65, 0.5); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100vh; background: #000; color: #fff; font-family: 'Cairo', sans-serif; display: flex; align-items: center; justify-content: center; direction: rtl; overflow: hidden; }
  body::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, rgba(0,25,0,0.7) 0%, #000 100%); z-index: 0; }
  body::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 255, 65, 0.04) 3px, rgba(0, 255, 65, 0.04) 3px); z-index: 0; pointer-events: none; }
  .hud-container { position: relative; z-index: 1; width: 95%; max-width: 800px; background: var(--matrix-dark); border: 2px solid var(--matrix-green); border-radius: 8px; padding: 40px 30px; box-shadow: 0 0 30px var(--matrix-glow); }
  .brand-title { font-family: 'Orbitron', sans-serif; font-size: 3.8rem; font-weight: 900; text-align: center; margin-bottom: 5px; letter-spacing: 4px; direction: ltr; color: #fff; text-shadow: 0 0 10px var(--matrix-green), 0 0 25px var(--matrix-green); }
  .brand-sub { font-size: 1.5rem; text-align: center; color: var(--matrix-green); font-weight: 900; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 15px; direction: ltr; font-family: 'Orbitron', sans-serif; }
  
  .contact-info { text-align: center; font-family: 'Cairo', sans-serif; font-size: 1.1rem; color: #ccc; margin-bottom: 25px; direction: rtl; line-height: 1.8; border-top: 1px dashed var(--matrix-green); border-bottom: 1px dashed var(--matrix-green); padding: 15px 0; background: rgba(0,255,65,0.03); }
  .contact-info span { color: var(--matrix-green); font-weight: 900; margin-left: 5px; }
  .contact-info .phones { direction: ltr; display: inline-block; font-family: monospace; font-size: 1.3rem; letter-spacing: 1px; color: #fff; }

  .status-panel { background: rgba(0, 0, 0, 0.8); padding: 30px 20px; border-radius: 4px; border: 1px solid var(--matrix-green); border-left: 6px solid var(--matrix-green); margin-bottom: 10px; position: relative; box-shadow: inset 0 0 20px rgba(0,255,65,0.1); }
  .status-panel::before { content: 'SYSTEM_CHECK'; position: absolute; top: -12px; left: 15px; background: var(--matrix-green); color: #000; padding: 2px 10px; font-family: 'Orbitron', sans-serif; font-size: 12px; font-weight: bold; border-radius: 2px; }
  #state { font-size: 26px; font-weight: 900; color: var(--matrix-green); text-align: center; margin-bottom: 10px; text-shadow: 0 0 10px var(--matrix-glow); }
  #det { font-size: 18px; color: #ddd; text-align: center; line-height: 1.8; }
  #det b { color: #000; background: var(--matrix-green); padding: 2px 8px; border-radius: 2px; }
  #cache { font-size: 14px; color: #888; text-align: center; margin-top: 15px; font-weight: bold; font-family: monospace; }
  #cache.cacheok { color: var(--matrix-green); text-shadow: 0 0 8px var(--matrix-glow); }
  .ok { color: #0f0; } .bad { color: #f00; } .warn { color: #ff0; }
  .footer-sys { position: fixed; bottom: 10px; right: 20px; font-family: monospace; font-size: 12px; color: var(--matrix-green); letter-spacing: 2px; z-index: 2; direction: ltr; opacity: 0.7; }
  @media (max-width: 600px) { .brand-title { font-size: 2.5rem; } .hud-container { padding: 30px 15px; } .contact-info { font-size: 0.95rem; } .contact-info .phones { font-size: 1.1rem; } }
</style>
</head>
<body>
<div class="hud-container">
  <h1 class="brand-title">MATRIX STORE</h1>
  <div class="brand-sub">FW 11.00 - 12.00 - 13.00</div>
  
  <div class="contact-info">
    <div><span>📍 العنوان:</span> المحله الكبرى - شارع الجمهوريه الرئيسي - امام قهوه السماحي</div>
    <div><span>📞 للتواصل:</span> <div class="phones">01091441550 - 01276461006 - 01286025409</div></div>
  </div>

  <div class="status-panel"><div id="state">جارٍ فحص النظام...</div><div id="det"></div><div id="cache"></div></div>
</div>
<div class="footer-sys">MATRIX STORE v2.0</div>
<script>
(function () {
    var stateEl = document.getElementById("state"), detEl = document.getElementById("det"), cacheEl = document.getElementById("cache");
    function setState(t, c) { stateEl.innerHTML = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = "> " + t; cacheEl.className = ok ? "cacheok" : ""; }
    var params = new URLSearchParams(location.search), key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) { var minor = parseInt(m[2], 16), ms = minor.toString(16); if (ms.length < 2) ms = "0" + ms; key = m[1] + "." + ms; fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10); }
    var bug = null, why = "", forced = params.get("bug");
    if (forced === "lapse" || forced === "poops") { bug = forced; why = "تم التحديد يدوياً ?bug=" + forced; } else if (!key) { why = "تحذير: هذا المتصفح ليس بلايستيشن 4"; } else if (fwnum <= 1202) { bug = "lapse"; why = "النظام مدعوم: توجيه مسار (Lapse)"; } else if (fwnum >= 1250) { bug = "poops"; why = "النظام مدعوم: توجيه مسار (Poops)"; } else { why = "تحذير: هذا الإصدار غير مدعوم حالياً"; }
    var fwDisplay = key ? "<b>V_" + key + "</b>" : "<span style='color:#8f9eb0;'>UNKNOWN</span>", bugDisplay = bug ? "<b style='color:var(--matrix-green);'>" + bug.toUpperCase() + "_CHAIN</b>" : "<span style='color:#8f9eb0;'>N/A</span>";
    detEl.innerHTML = "OS_VERSION: " + fwDisplay + " | EXPLOIT: " + bugDisplay + "<br><br><span style='color: var(--matrix-green); font-size:16px;'>" + why + "</span>";
    if (!bug) { setState("إصدار غير مدعوم ACCESS DENIED", "bad"); return; }
    var target = (bug === "lapse" ? "run_lapse.html" : "run_poops.html") + location.search;
    function go() { setState("جارٍ تهيئة الثغرة INITIATING...", "warn"); setTimeout(function() { location.replace(target); }, 500); }
    function waitForTap(msg, action) { setState(msg, "warn"); function fire() { window.removeEventListener("click", fire); window.removeEventListener("keydown", fire); action(); } window.addEventListener("click", fire); window.addEventListener("keydown", fire); }
    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) { go(); }
    else if (!navigator.onLine) { setCache("وضع الأوفلاين نشط", true); go(); }
    else if (ac.status === ac.IDLE) { setCache("ملفات الكاش جاهزة للاستخدام", true); go(); }
    else if (ac.status === ac.UPDATEREADY) { try { ac.swapCache(); } catch (e) {} setCache("تم تحميل التحديث بنجاح", true); waitForTap("تحديث جاهز — اضغط للتنفيذ", function () { location.reload(); }); } else {
        setCache("جارٍ فحص التخزين المؤقت...");
        ac.addEventListener("downloading", function () { setCache("يتم سحب الملفات للمرة الأولى..."); }, false);
        ac.addEventListener("progress", function (e) { if (e && e.total) { setCache("جاري التخزين: " + Math.round((e.loaded / e.total) * 100) + "%"); } }, false);
        ac.addEventListener("cached", function () { setCache("اكتمل التخزين — يمكنك الاستخدام بدون نت", true); waitForTap("النظام جاهز — اضغط للتشغيل", go); }, false);
        ac.addEventListener("updateready", function () { try { ac.swapCache(); } catch (e) {} setCache("التحديث جاهز", true); waitForTap("تحديث متوفر — اضغط لإعادة التحميل", function () { location.reload(); }); }, false);
        ac.addEventListener("noupdate", function () { setCache("التخزين المؤقت محدث وجاهز", true); go(); }, false);
        ac.addEventListener("error", function () { setCache("حدث خطأ في سحب الكاش"); waitForTap("فشل التخزين — اضغط للتشغيل الإجباري", go); }, false);
        ac.addEventListener("obsolete", function () { setCache("ملفات الكاش قديمة"); waitForTap("تنبيه ملفات قديمة — اضغط للتشغيل", go); }, false);
    }
})();
</script>
</body>
</html>
