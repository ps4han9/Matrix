<!DOCTYPE html>
<html lang="ar" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MATRIX STORE - Poops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root { --matrix-green: #00ff41; --matrix-dark: rgba(0, 15, 0, 0.9); --matrix-glow: rgba(0, 255, 65, 0.5); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100vh; background: #000; color: #fff; font-family: 'Cairo', sans-serif; display: flex; align-items: center; justify-content: center; direction: rtl; overflow: hidden; }
  body::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, rgba(0,25,0,0.7) 0%, #000 100%); z-index: 0; }
  body::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 255, 65, 0.04) 3px, rgba(0, 255, 65, 0.04) 3px); z-index: 0; pointer-events: none; }
  .hud-container { position: relative; z-index: 1; width: 95%; max-width: 900px; background: var(--matrix-dark); border: 2px solid var(--matrix-green); border-radius: 8px; padding: 40px 30px; box-shadow: 0 0 30px var(--matrix-glow); }
  .brand-title { font-family: 'Orbitron', sans-serif; font-size: 3.8rem; font-weight: 900; text-align: center; margin-bottom: 5px; letter-spacing: 4px; direction: ltr; color: #fff; text-shadow: 0 0 10px var(--matrix-green), 0 0 25px var(--matrix-green); }
  .brand-sub { font-size: 1.5rem; text-align: center; color: var(--matrix-green); font-weight: 900; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 10px; direction: ltr; font-family: 'Orbitron', sans-serif; }
  
  .contact-info { text-align: center; font-family: 'Cairo', sans-serif; font-size: 1.1rem; color: #ccc; margin-bottom: 25px; direction: rtl; line-height: 1.8; border-top: 1px dashed var(--matrix-green); border-bottom: 1px dashed var(--matrix-green); padding: 15px 0; background: rgba(0,255,65,0.03); }
  .contact-info span { color: var(--matrix-green); font-weight: 900; margin-left: 5px; }
  .contact-info .phones { direction: ltr; display: inline-block; font-family: monospace; font-size: 1.3rem; letter-spacing: 1px; color: #fff; }

  .status-panel { background: rgba(0, 0, 0, 0.8); padding: 20px; border-radius: 4px; border: 1px solid var(--matrix-green); border-left: 6px solid var(--matrix-green); margin-bottom: 20px; position: relative; box-shadow: inset 0 0 20px rgba(0,255,65,0.1); }
  .status-panel::before { content: 'EXECUTION'; position: absolute; top: -12px; left: 15px; background: var(--matrix-green); color: #000; padding: 2px 10px; font-family: 'Orbitron', sans-serif; font-size: 12px; font-weight: bold; border-radius: 2px; }
  #state { font-size: 26px; font-weight: 900; color: var(--matrix-green); text-align: center; margin-bottom: 10px; text-shadow: 0 0 10px var(--matrix-glow); }
  .loader-wrapper { display: flex; justify-content: center; gap: 8px; margin-top: 10px; }
  .dot { width: 15px; height: 15px; background: var(--matrix-green); border-radius: 0; box-shadow: 0 0 10px var(--matrix-glow); animation: matrix-load 1s infinite alternate; }
  .dot:nth-child(2) { animation-delay: 0.2s; } .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes matrix-load { to { opacity: 0.1; transform: scale(0.5); } }
  #out-container { position: absolute; width: 1px; height: 1px; overflow: hidden; opacity: 0; pointer-events: none; }
  #out { white-space: pre-wrap; font: 12px/1.45 Consolas, monospace; background: rgba(0, 10, 0, 0.9); border: 1px solid var(--matrix-green); border-radius: 4px; padding: 14px; max-height: 250px; overflow-y: auto; color: var(--matrix-green); direction: ltr; text-align: left; }
  .done { color: var(--matrix-green) !important; text-shadow: 0 0 10px var(--matrix-glow) !important; } .error { color: #ff0000 !important; text-shadow: 0 0 10px #ff0000 !important; }
  .footer-sys { position: fixed; bottom: 10px; right: 20px; font-family: monospace; font-size: 12px; color: rgba(255,255,255,0.3); letter-spacing: 2px; z-index: 2; direction: ltr; opacity: 0.7; }
  @media (max-width: 600px) { .brand-title { font-size: 2.5rem; } .brand-sub { font-size: 1.2rem; } .contact-info { font-size: 0.95rem; } .contact-info .phones { font-size: 1rem; } }
</style>
</head>
<body>
<div class="hud-container">
  <h1 class="brand-title">MATRIX STORE</h1>
  <div class="brand-sub">POOPS EXPLOIT</div>
  
  <div class="contact-info">
    <div><span>📍 العنوان:</span> المحله الكبرى - شارع الجمهوريه الرئيسي - امام قهوه السماحي</div>
    <div><span>📞 للتواصل:</span> <div class="phones">01091441550 - 01276461006 - 01286025409</div></div>
  </div>

  <div class="status-panel"><div id="state"><span id="stateText">جارٍ تحميل سلسلة Poops<br><small>Please Wait...</small></span><div class="loader-wrapper"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div></div>
  <div id="out-container"><div id="out"></div></div>
</div>
<div class="footer-sys">MATRIX STORE v2.0 - Poops</div>
<script type="module">
import "./chain_poops.js";
const state = document.getElementById("state"), stateText = document.getElementById("stateText");
window.poopsDone = function () { state.classList.add("done"); stateText.innerHTML = "اكتملت العملية بنجاح<br><small>EXPLOIT SUCCESSFUL</small>"; document.querySelector('.loader-wrapper').style.display = 'none'; };
window.poopsError = function () { state.classList.add("error"); stateText.innerHTML = "حدث خطأ أثناء التنفيذ<br><small>EXPLOIT FAILED</small>"; document.querySelector('.loader-wrapper').style.display = 'none'; };
</script>
</body>
</html>
